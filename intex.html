<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Abhigna ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020005;
    color:white;
    font-family:Georgia, serif;
    overflow-x:hidden;
}

/* =========================
   LOADING SCREEN
========================= */

#loader{
    position:fixed;
    inset:0;
    background:#020005;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:opacity 1.5s ease;
}

.loader-heart{
    font-size:70px;
    animation:heartbeat 1s infinite;
}

.loader-text{
    margin-top:20px;
    letter-spacing:5px;
    color:#ff9acb;
    font-size:14px;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.3);}
}

/* =========================
   CINEMATIC INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9998;
    background:
    radial-gradient(circle at center,#3a0a35 0%,#08000d 45%,#000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:opacity 2s ease;
}

.intro-content{
    padding:30px;
}

.intro-small{
    letter-spacing:8px;
    font-size:13px;
    color:#ffc1df;
    margin-bottom:25px;
}

.intro-title{
    font-size:clamp(40px,10vw,100px);
    font-weight:normal;
    color:white;
    text-shadow:
    0 0 15px #ff4da6,
    0 0 40px #ff0080;
    animation:titleGlow 3s infinite alternate;
}

.intro-name{
    color:#ff75b9;
}

@keyframes titleGlow{
    from{
        text-shadow:0 0 10px #ff4da6;
    }
    to{
        text-shadow:
        0 0 20px #ff4da6,
        0 0 60px #ff0080;
    }
}

/* =========================
   MAIN
========================= */

#main{
    opacity:0;
    transition:opacity 2s;
}

section{
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* =========================
   HERO
========================= */

.hero{
    background:
    linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.75)
    ),
    radial-gradient(circle at center,#4a0a3f,#050008 70%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(white 1px,transparent 1px),
    radial-gradient(#ff9bd4 1px,transparent 1px);
    background-size:90px 90px,130px 130px;
    animation:starsMove 20s linear infinite;
    opacity:.5;
}

@keyframes starsMove{
    from{transform:translateY(0);}
    to{transform:translateY(90px);}
}

.hero-content{
    text-align:center;
    z-index:5;
    padding:20px;
}

.hero-subtitle{
    letter-spacing:8px;
    color:#ffc4e1;
    font-size:14px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(55px,13vw,150px);
    font-weight:normal;
    line-height:.9;
    color:#fff;
    text-shadow:
    0 0 20px #ff6ab5,
    0 0 70px #ff006e;
}

.hero h1 span{
    display:block;
    color:#ff7fc0;
}

.hero-message{
    max-width:700px;
    margin:35px auto;
    color:#ddd;
    font-size:18px;
    line-height:1.8;
}

.start-button{
    padding:15px 35px;
    border:1px solid #ff79bd;
    border-radius:50px;
    background:rgba(255,70,150,.1);
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(255,50,150,.4);
    transition:.3s;
}

.start-button:hover{
    background:#ff4fa5;
    transform:scale(1.08);
}
